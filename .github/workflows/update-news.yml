name: Update news.json

on:
  schedule:
    # 매일 UTC 01:00, 13:00 = KST 10:00, 22:00 (하루 2회)
    - cron: '0 1,13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Gemini 호출 없이 뉴스 후보 수집만 테스트 (무료 할당량 안 씀)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch & curate news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 예비 키(다른 Google 계정) — 저장소 Secrets에 등록해두면 첫 키의 무료 할당량이
          # 소진됐을 때 스크립트가 자동으로 이 키로 전환해서 쓴다. 등록 안 해놔도 무해함.
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # 스크립트 내부에도 503(과부하) 재시도가 있지만(최대 약 3분),
          # 수요 폭증이 그보다 길게 이어지는 경우를 대비해 전체 스크립트 단위로
          # 한 번 더 재시도한다(5분 간격, 총 3회 시도).
          for i in 1 2 3; do
            node scripts/update-news.mjs && break
            if [ "$i" -lt 3 ]; then
              echo "스크립트 실행 실패 — 5분 대기 후 전체 재시도 ($i/3)"
              sleep 300
            else
              echo "3회 모두 실패 — 종료"
              exit 1
            fi
          done

      - name: Commit and push news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json daily-news.md
          git diff --quiet --cached || git commit -m "Update news.json"

          # 실행이 겹치면(수동 실행 + 스케줄 실행 등) 그 사이에 origin/main이
          # 앞서 나가 있을 수 있음 — push 직전에 최신 원격 커밋 위로 rebase하고,
          # 그래도 경쟁이 나면 짧게 대기 후 재시도한다.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin main && break
            echo "push 실패(경쟁 상태로 추정) — rebase 초기화 후 잠시 대기, 재시도 ($i/5)"
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
